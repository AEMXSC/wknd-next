<style>
  .wk { font-family: "Instrument Sans", Arial, sans-serif; color: #0f1a14; max-width: 560px; margin: 0 auto; }
  .wk-persona { padding: 26px; border: 2px solid #0f1a14; border-radius: 20px; background: #fff; }
  .wk-top { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
  .wk-avatar { width: 56px; height: 56px; border-radius: 50%; background: #e8651a; display: grid; place-items: center; font-family: Syncopate, Arial, sans-serif; font-weight: 700; font-size: 22px; }
  .wk-name { font-family: Syncopate, Arial, sans-serif; font-weight: 700; font-size: 24px; text-transform: uppercase; margin: 0; }
  .wk-user { color: #3d4f45; margin: 2px 0 0; font-size: 14px; }
  .wk-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; list-style: none; padding: 0; margin: 0; }
  .wk-facts li { background: #f5f0e8; border-radius: 10px; padding: 10px 12px; }
  .wk-facts span { display: block; font-size: 12px; color: #3d4f45; text-transform: uppercase; letter-spacing: .08em; }
  .wk-facts strong { font-size: 16px; }
  .wk-app { display: flex; justify-content: flex-end; margin-top: 14px; padding: 12px 16px; border: 2px solid #0f1a14; border-radius: 10px; background: #f5f0e8; font-size: 14px; }
  .wk-app a { font-weight: 700; color: #0f1a14; }
</style>
<div class="wk">
  <section class="wk-persona">
    <div class="wk-top">
      <span class="wk-avatar" aria-hidden="true">&#9650;</span>
      <div>
        <h2 class="wk-name">{{fields.name}}</h2>
        <p class="wk-user">{{fields.userName}} &middot; {{fields.occupation}}</p>
      </div>
    </div>
    <ul class="wk-facts">
      <li><span>Interest</span><strong>{{fields.interest}}</strong></li>
      <li><span>Home base</span><strong>{{fields.location}}</strong></li>
      <li><span>Age</span><strong>{{fields.age}}</strong></li>
      <li><span>Brand</span><strong>{{fields.brand}}</strong></li>
    </ul>
  </section>
  <p class="wk-app"><a href="<YOUR_APP_URL>/?cf={{properties.path}}" target="_blank" rel="noopener">Preview the app as {{fields.name}} &rarr;</a></p>
</div>

<meta charset="utf-8">
<style>
  @font-face { font-family: "Instrument Sans"; font-weight: 400 700; font-display: swap; src: url(https://wknd-adventures.com/fonts/instrument-sans-latin.woff2) format("woff2"); }
  @font-face { font-family: "Syncopate"; font-weight: 400; font-display: swap; src: url(https://wknd-adventures.com/fonts/syncopate-400-latin.woff2) format("woff2"); }
  @font-face { font-family: "Syncopate"; font-weight: 700; font-display: swap; src: url(https://wknd-adventures.com/fonts/syncopate-700-latin.woff2) format("woff2"); }
  .wk { --black: #0f1a14; --amber: #e8651a; --g100: #f0ece4; --g200: #ddd8cf; --g700: #3d4f45; font-family: "Instrument Sans", sans-serif; color: var(--black); line-height: 1.6; max-width: 30rem; margin: 0 auto; -webkit-font-smoothing: antialiased; }
  .wk * { box-sizing: border-box; }
  .wk p { margin: 0; }
  .wk-card { background: #fff; border: 1px solid var(--g200); border-radius: 1.25rem; padding: 1.5rem; }
  .wk-top { display: flex; gap: 1rem; align-items: center; margin-bottom: 1.25rem; }
  .wk-avatar { flex: none; width: 3.5rem; height: 3.5rem; border-radius: 9999px; background: var(--amber); display: grid; place-items: center; font-family: Syncopate, sans-serif; font-weight: 700; font-size: 1.25rem; box-shadow: 3px 3px 0 0 var(--black); }
  .wk-tag { display: inline-flex; align-items: center; background: var(--amber); color: #fff; border-radius: 9999px; font-family: Syncopate, sans-serif; font-size: .65rem; font-weight: 600; letter-spacing: .05em; padding: .3125rem .5rem .1875rem; margin-bottom: .375rem; }
  .wk-name { font-family: Syncopate, sans-serif; font-weight: 700; font-size: 1.5rem; line-height: 1.1; margin: 0; }
  .wk-user { color: var(--g700); font-size: .875rem; margin-top: .25rem !important; }
  .wk-facts { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; list-style: none; padding: 0; margin: 0; }
  .wk-facts li { background: var(--g100); border-radius: .5rem; padding: .625rem .75rem; }
  .wk-facts span { display: block; font-size: .75rem; color: var(--g700); }
  .wk-facts strong { font-size: 1rem; }
  .wk-app { display: flex; justify-content: flex-end; margin-top: 1rem; padding: .75rem .25rem; border-top: 1px solid var(--g200); }
  .wk-link { font-family: Syncopate, sans-serif; font-size: .875rem; font-weight: 700; letter-spacing: .06em; color: var(--black); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
</style>
<div class="wk">
  <section class="wk-card">
    <div class="wk-top">
      <span class="wk-avatar" aria-hidden="true">&#9650;</span>
      <div>
        <span class="wk-tag">Persona</span>
        <h2 class="wk-name">{{fields.name}}</h2>
        <p class="wk-user">{{fields.userName}} &middot; {{fields.occupation}}</p>
      </div>
    </div>
    <ul class="wk-facts">
      <li><span>Interest</span><strong>{{fields.interest}}</strong></li>
      <li><span>Home base</span><strong>{{fields.location}}</strong></li>
      <li><span>Age</span><strong>{{fields.age}}</strong></li>
      <li><span>Brand</span><strong>{{fields.brand}}</strong></li>
    </ul>
  </section>
  <p class="wk-app"><a class="wk-link" href="<YOUR_APP_URL>/?cf={{properties.path}}" target="_blank" rel="noopener">Preview the app as {{fields.name}}</a></p>
</div>

<meta charset="utf-8">
<style>
  @font-face { font-family: "Instrument Sans"; font-weight: 400 700; font-display: swap; src: url(https://wknd-adventures.com/fonts/instrument-sans-latin.woff2) format("woff2"); }
  @font-face { font-family: "Syncopate"; font-weight: 400; font-display: swap; src: url(https://wknd-adventures.com/fonts/syncopate-400-latin.woff2) format("woff2"); }
  @font-face { font-family: "Syncopate"; font-weight: 700; font-display: swap; src: url(https://wknd-adventures.com/fonts/syncopate-700-latin.woff2) format("woff2"); }
  .wk { --black: #0f1a14; --amber: #e8651a; --cream: #f5f0e8; --g200: #ddd8cf; --g700: #3d4f45; font-family: "Instrument Sans", sans-serif; color: var(--black); line-height: 1.6; max-width: 34rem; margin: 0 auto; -webkit-font-smoothing: antialiased; }
  .wk * { box-sizing: border-box; }
  .wk p { margin: 0; }
  .wk-alert { display: flex; gap: .75rem; padding: 1.5rem; border: 2px solid var(--black); border-radius: 1.25rem; background: var(--cream); box-shadow: 3px 3px 0 0 var(--black); }
  .wk-icon { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--amber); display: grid; place-items: center; font-weight: 700; }
  .wk-tag { display: inline-flex; align-items: center; background: var(--amber); color: #fff; border-radius: 9999px; font-family: Syncopate, sans-serif; font-size: .65rem; font-weight: 600; letter-spacing: .05em; padding: .3125rem .5rem .1875rem; margin-bottom: .5rem; }
  .wk-head { font-size: 1rem; font-weight: 700; margin: 0 0 .25rem; }
  .wk-detail { font-size: .875rem; color: var(--g700); }
  .wk-app { display: flex; justify-content: flex-end; margin-top: 1rem; padding: .75rem .25rem; border-top: 1px solid var(--g200); }
  .wk-link { font-family: Syncopate, sans-serif; font-size: .875rem; font-weight: 700; letter-spacing: .06em; color: var(--black); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
</style>
<div class="wk">
  <section class="wk-alert">
    <span class="wk-icon" aria-hidden="true">!</span>
    <div>
      <span class="wk-tag">Trail &amp; permit alert</span>
      <h3 class="wk-head">{{fields.termsReference}}</h3>
      <div class="wk-detail">{{{fields.termDetails}}}</div>
    </div>
  </section>
  <p class="wk-app"><a class="wk-link" href="<YOUR_APP_URL>/?cf={{properties.path}}" target="_blank" rel="noopener">Open in WKND app</a></p>
</div>

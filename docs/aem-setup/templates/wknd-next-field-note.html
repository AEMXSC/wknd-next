<meta charset="utf-8">
<style>
  @font-face { font-family: "Instrument Sans"; font-weight: 400 700; font-display: swap; src: url(https://wknd-adventures.com/fonts/instrument-sans-latin.woff2) format("woff2"); }
  @font-face { font-family: "Syncopate"; font-weight: 400; font-display: swap; src: url(https://wknd-adventures.com/fonts/syncopate-400-latin.woff2) format("woff2"); }
  @font-face { font-family: "Syncopate"; font-weight: 700; font-display: swap; src: url(https://wknd-adventures.com/fonts/syncopate-700-latin.woff2) format("woff2"); }
  .wk { --black: #0f1a14; --amber: #e8651a; --g200: #ddd8cf; --g500: #7a8a80; font-family: "Instrument Sans", sans-serif; color: var(--black); line-height: 1.6; max-width: 26rem; margin: 0 auto; -webkit-font-smoothing: antialiased; }
  .wk * { box-sizing: border-box; }
  .wk h3 { font-family: Syncopate, sans-serif; font-weight: 700; line-height: 1.1; margin: 0; font-size: 1.5rem; }
  .wk p { margin: 0; }
  .wk-card { background: #fff; border: 1px solid var(--g200); border-radius: 1.25rem; overflow: hidden; }
  .wk-card-img { aspect-ratio: 16 / 10; overflow: hidden; }
  .wk-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .wk-card-body { display: flex; flex-direction: column; gap: .75rem; padding: 1.5rem 1rem; }
  .wk-tag { align-self: flex-start; display: inline-flex; align-items: center; background: var(--amber); color: #fff; border-radius: 9999px; font-family: Syncopate, sans-serif; font-size: .65rem; font-weight: 600; letter-spacing: .05em; padding: .3125rem .5rem .1875rem; }
  .wk-muted { color: var(--g500); font-size: .875rem; line-height: 1.5; }
  .wk-app { display: flex; justify-content: flex-end; margin-top: 1rem; padding: .75rem .25rem; border-top: 1px solid var(--g200); }
  .wk-link { font-family: Syncopate, sans-serif; font-size: .875rem; font-weight: 700; letter-spacing: .06em; color: var(--black); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
</style>
<div class="wk">
  <article class="wk-card">
    {{#fields.heroImage}}<div class="wk-card-img">{{{fields.heroImage}}}</div>{{/fields.heroImage}}
    <div class="wk-card-body">
      <span class="wk-tag">Field note</span>
      <h3>{{fields.headline}}</h3>
      <div class="wk-muted">{{{fields.main}}}</div>
    </div>
  </article>
  <p class="wk-app"><a class="wk-link" href="<YOUR_APP_URL>/?cf={{properties.path}}" target="_blank" rel="noopener">Open in WKND app</a></p>
</div>

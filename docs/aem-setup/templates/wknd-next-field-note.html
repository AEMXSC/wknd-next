<style>
  .wk { font-family: "Instrument Sans", Arial, sans-serif; color: #0f1a14; max-width: 720px; margin: 0 auto; }
  .wk-note { border: 1px solid #ddd8cf; border-radius: 20px; overflow: hidden; background: #fff; }
  .wk-media img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; }
  .wk-body { padding: 24px 28px 28px; }
  .wk-tag { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #b4500f; margin: 0 0 8px; }
  .wk-head { font-family: Syncopate, Arial, sans-serif; font-weight: 700; font-size: 24px; line-height: 1.2; text-transform: uppercase; margin: 0 0 12px; }
  .wk-main { font-size: 16px; line-height: 1.6; color: #3d4f45; }
  .wk-app { display: flex; justify-content: flex-end; margin-top: 14px; padding: 12px 16px; border: 2px solid #0f1a14; border-radius: 10px; background: #f5f0e8; font-size: 14px; }
  .wk-app a { font-weight: 700; color: #0f1a14; }
</style>
<div class="wk">
  <article class="wk-note">
    {{#fields.heroImage}}<div class="wk-media">{{{fields.heroImage}}}</div>{{/fields.heroImage}}
    <div class="wk-body">
      <p class="wk-tag">Field note</p>
      <h2 class="wk-head">{{fields.headline}}</h2>
      <div class="wk-main">{{{fields.main}}}</div>
    </div>
  </article>
  <p class="wk-app"><a href="<YOUR_APP_URL>/?cf={{properties.path}}" target="_blank" rel="noopener">Open in WKND app &rarr;</a></p>
</div>
